name: Build UbiMacro.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the Windows input backend loads
        run: >
          python -c "import ctypes; from ubimacro import backends as b;
          be = b.get_backend(); print(type(be).__name__);
          assert type(be).__name__ == 'WindowsBackend';
          assert ctypes.sizeof(b.INPUT) == 40, ctypes.sizeof(b.INPUT);
          assert b._user32.MapVirtualKeyW(0x57, 0) == 0x11, 'W scancode'"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name UbiMacro
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          run.py

      - uses: actions/upload-artifact@v4
        with:
          name: UbiMacro-windows
          path: dist/UbiMacro.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UbiMacro.exe
          generate_release_notes: true
